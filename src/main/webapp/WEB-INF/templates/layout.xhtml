<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title><ui:insert name="titulo">Clínica UDB</ui:insert></title>

    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css"/>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
    <!-- CSS Personalizado para modales, growls y calendarios opacos -->
    <h:outputStylesheet name="css/custom.css"/>
</h:head>

<h:body class="hold-transition sidebar-mini">
    <div class="wrapper">

        <!-- Navbar Superior con Información de Usuario y Botón Cerrar Sesión -->
        <nav class="main-header navbar navbar-expand navbar-white navbar-light">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
                </li>
            </ul>

            <ul class="navbar-nav ml-auto">
                <li class="nav-item d-flex align-items-center mr-3">
                    <span class="text-secondary font-weight-bold mr-2">
                        <i class="fas fa-user-circle mr-1"/>#{loginBean.usuarioLogueado.nombreCompleto}
                    </span>
                    <span class="badge badge-info">#{loginBean.usuarioLogueado.rol}</span>
                </li>
                <li class="nav-item">
                    <h:form>
                        <p:commandButton value="Cerrar Sesión" 
                                         icon="fas fa-sign-out-alt" 
                                         action="#{loginBean.cerrarSesion}" 
                                         styleClass="btn btn-outline-danger btn-sm"/>
                    </h:form>
                </li>
            </ul>
        </nav>

        <!-- Main Sidebar Container -->
        <aside class="main-sidebar sidebar-dark-primary elevation-4">
            <a href="#" class="brand-link text-center">
                <span class="brand-text font-weight-light"><b>Clínica</b> UDB</span>
            </a>

            <div class="sidebar">
                <nav class="mt-2">
                    <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
                        <li class="nav-item">
                            <h:link outcome="/views/pacientes/listado.xhtml" styleClass="nav-link">
                                <i class="nav-icon fas fa-users"></i>
                                <p>Pacientes</p>
                            </h:link>
                        </li>
                        <li class="nav-item">
                            <h:link outcome="/views/medicos/listado.xhtml" styleClass="nav-link">
                                <i class="nav-icon fas fa-user-md"></i>
                                <p>Médicos</p>
                            </h:link>
                        </li>
                        <li class="nav-item">
                            <h:link outcome="/views/citas/listado.xhtml" styleClass="nav-link">
                                <i class="nav-icon fas fa-calendar-check"></i>
                                <p>Citas</p>
                            </h:link>
                        </li>
                    </ul>
                </nav>
            </div>
        </aside>

        <!-- Content Wrapper -->
        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1><ui:insert name="tituloPagina">Panel de Control</ui:insert></h1>
                        </div>
                    </div>
                </div>
            </section>

            <section class="content">
                <div class="container-fluid">
                    <ui:insert name="contenido"/>
                </div>
            </section>
        </div>

        <footer class="main-footer text-center">
            <strong>Sistema de Gestión - Clínica UDB 2026</strong>
        </footer>

    </div>

    <!-- AdminLTE y Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
</h:body>
</html>
