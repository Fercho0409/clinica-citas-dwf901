<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title><ui:insert name="titulo">Clínica</ui:insert></title>

    <!-- AdminLTE 3.2 + Font Awesome + Google Fonts (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700"/>
    <h:outputStylesheet library="css" name="custom.css"/>
</h:head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

    <!-- ===== Navbar ===== -->
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-widget="pushmenu" href="#" role="button">
                    <i class="fas fa-bars"></i>
                </a>
            </li>
            <li class="nav-item d-none d-sm-inline-block">
                <a href="#{request.contextPath}/index.xhtml" class="nav-link">Inicio</a>
            </li>
        </ul>
    </nav>

    <!-- ===== Sidebar ===== -->
    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a href="#{request.contextPath}/index.xhtml" class="brand-link">
            <i class="fas fa-hospital ms-3 me-2"></i>
            <span class="brand-text font-weight-light">Clínica UDB</span>
        </a>
        <div class="sidebar">
            <nav class="mt-2">
                <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview">
                    <li class="nav-item">
                        <a href="#{request.contextPath}/index.xhtml" class="nav-link">
                            <i class="nav-icon fas fa-home"></i><p>Inicio</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#{request.contextPath}/views/pacientes/listado.xhtml" class="nav-link">
                            <i class="nav-icon fas fa-users"></i><p>Pacientes</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#{request.contextPath}/views/medicos/listado.xhtml" class="nav-link">
                            <i class="nav-icon fas fa-user-md"></i><p>Médicos</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#{request.contextPath}/views/citas/listado.xhtml" class="nav-link">
                            <i class="nav-icon fas fa-calendar-check"></i><p>Citas</p>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>

    <!-- ===== Contenido ===== -->
    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1><ui:insert name="tituloPagina">Página</ui:insert></h1>
                    </div>
                </div>
            </div>
        </section>
        <section class="content">
            <div class="container-fluid">
                <ui:insert name="contenido"/>
            </div>
        </section>
    </div>

    <!-- ===== Footer ===== -->
    <footer class="main-footer">
        <div class="float-right d-none d-sm-inline">DWF901 - Fase 2</div>
        <strong>Universidad Don Bosco &#169; 2026</strong>
    </footer>
</div>

<!-- Scripts de AdminLTE (jQuery + Bootstrap 4 + AdminLTE) -->
<h:outputScript library="js" name="adminlte-setup.js" target="body"/>
</body>
</html>
