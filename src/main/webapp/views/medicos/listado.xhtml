<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
<h:head/>
<body>
<ui:composition template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="titulo">Médicos</ui:define>
    <ui:define name="tituloPagina">Gestión de Médicos</ui:define>

    <ui:define name="contenido">

        <p:growl id="growlMed" showDetail="true" life="4000"/>

        <div class="card card-success card-outline">
            <div class="card-header">
                <h3 class="card-title"><i class="fas fa-user-md mr-2"/>Listado de Médicos</h3>
                <div class="card-tools">
                    <h:form>
                        <p:commandButton value="Nuevo Médico"
                                         icon="fas fa-plus"
                                         actionListener="#{medicoBean.nuevo}"
                                         oncomplete="PF('dlgMedico').show()"
                                         update=":formMedico"
                                         styleClass="btn btn-success btn-sm"/>
                    </h:form>
                </div>
            </div>

            <div class="card-body">

                <!-- ===== Filtros AJAX ===== -->
                <h:form id="formFiltroMed">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <p:inputText value="#{medicoBean.filtroTexto}"
                                         placeholder="Buscar por nombre, apellido..."
                                         styleClass="form-control">
                                <p:ajax event="keyup" delay="400"
                                        listener="#{medicoBean.filtrar}"
                                        update="tablaMedicos"/>
                            </p:inputText>
                        </div>
                        <div class="col-md-3">
                            <p:commandButton value="Limpiar"
                                             icon="fas fa-eraser"
                                             actionListener="#{medicoBean.limpiarFiltros}"
                                             update="formFiltroMed tablaMedicos"
                                             styleClass="btn btn-secondary"/>
                        </div>
                    </div>

                    <!-- ===== Tabla Médicos ===== -->
                    <p:dataTable id="tablaMedicos"
                                 var="med"
                                 value="#{medicoBean.medicosFiltrados}"
                                 styleClass="table table-striped table-hover"
                                 emptyMessage="No hay médicos registrados"
                                 rows="10"
                                 paginator="true"
                                 paginatorPosition="bottom"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rowsPerPageTemplate="5,10,25,50"
                                 currentPageReportTemplate="Mostrando {startRecord} a {endRecord} de {totalRecords}">

                        <p:column headerText="ID" style="width:60px">
                            <h:outputText value="#{med.idMedico}"/>
                        </p:column>
                        <p:column headerText="Nombres">
                            <h:outputText value="#{med.nombres}"/>
                        </p:column>
                        <p:column headerText="Apellidos">
                            <h:outputText value="#{med.apellidos}"/>
                        </p:column>
                        <p:column headerText="Especialidad">
                            <h:outputText value="#{med.especialidad}"/>
                        </p:column>
                        <p:column headerText="Teléfono">
                            <h:outputText value="#{med.telefono}"/>
                        </p:column>
                        <p:column headerText="Correo">
                            <h:outputText value="#{med.correo}"/>
                        </p:column>
                        <p:column headerText="Acciones" styleClass="text-center" style="width:130px">
                            <p:commandButton icon="fas fa-edit"
                                             title="Editar"
                                             actionListener="#{medicoBean.editar(med)}"
                                             oncomplete="PF('dlgMedico').show()"
                                             update=":formMedico"
                                             styleClass="btn btn-warning btn-sm mr-1"/>
                            <p:commandButton icon="fas fa-trash"
                                             title="Eliminar"
                                             actionListener="#{medicoBean.eliminar(med)}"
                                             update=":growlMed tablaMedicos"
                                             styleClass="btn btn-danger btn-sm"
                                             onclick="return confirm('¿Eliminar este médico?');"/>
                        </p:column>
                    </p:dataTable>
                </h:form>
            </div>
        </div>

        <!-- ===== Diálogo Crear/Editar con Validadores ===== -->
        <p:dialog header="Datos del Médico"
                  widgetVar="dlgMedico"
                  modal="true"
                  responsive="true"
                  width="600"
                  appendTo="@(body)"
                  showEffect="fade"
                  hideEffect="fade"
                  styleClass="bg-white">
            <h:form id="formMedico">
                <p:panelGrid columns="2" layout="grid" styleClass="w-100" columnClasses="col-4,col-8">
                    <p:outputLabel for="mnombres" value="Nombres:"/>
                    <p:inputText id="mnombres" value="#{medicoBean.medico.nombres}"
                                 required="true" styleClass="form-control"/>

                    <p:outputLabel for="mapellidos" value="Apellidos:"/>
                    <p:inputText id="mapellidos" value="#{medicoBean.medico.apellidos}"
                                 required="true" styleClass="form-control"/>

                    <p:outputLabel for="mespecialidad" value="Especialidad:"/>
                    <p:inputText id="mespecialidad" value="#{medicoBean.medico.especialidad}"
                                 required="true" styleClass="form-control"/>

                    <p:outputLabel for="mtelefono" value="Teléfono:"/>
                    <p:inputText id="mtelefono" value="#{medicoBean.medico.telefono}"
                                 styleClass="form-control" placeholder="7000-0000">
                        <f:validator validatorId="telefonoValidator"/>
                    </p:inputText>

                    <p:outputLabel for="mcorreo" value="Correo:"/>
                    <p:inputText id="mcorreo" value="#{medicoBean.medico.correo}"
                                 styleClass="form-control" placeholder="medico@clinica.com">
                        <f:validator validatorId="emailValidator"/>
                    </p:inputText>
                </p:panelGrid>

                <div class="text-right mt-3">
                    <p:commandButton value="Guardar"
                                     icon="fas fa-save"
                                     actionListener="#{medicoBean.guardar}"
                                     update=":growlMed :formFiltroMed:tablaMedicos :formFiltroMed @form"
                                     oncomplete="if (!args.validationFailed) PF('dlgMedico').hide();"
                                     styleClass="btn btn-success"/>
                    <p:commandButton value="Cancelar"
                                     icon="fas fa-times"
                                     type="button"
                                     onclick="PF('dlgMedico').hide()"
                                     styleClass="btn btn-secondary ml-2"/>
                </div>
            </h:form>
        </p:dialog>

    </ui:define>
</ui:composition>
</body>
</html>
