<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
<h:head/>
<body>
<ui:composition template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="titulo">Médicos</ui:define>
    <ui:define name="tituloPagina">Gestión de Médicos</ui:define>

    <ui:define name="contenido">

        <!-- Mensajes globales -->
        <p:growl id="growl" showDetail="true" life="4000"/>

        <div class="card card-primary card-outline">
            <div class="card-header">
                <h3 class="card-title"><i class="fas fa-user-md mr-2"/>Listado de Médicos</h3>
                <div class="card-tools">
                    <h:form>
                        <p:commandButton value="Nuevo Médico"
                                         icon="fas fa-plus"
                                         actionListener="#{medicoBean.nuevo}"
                                         oncomplete="PF('dlgMedico').show()"
                                         update=":formMedico"
                                         styleClass="btn btn-primary btn-sm"/>
                    </h:form>
                </div>
            </div>

            <div class="card-body">

                <!-- ===== Filtros ===== -->
                <h:form id="formFiltro">
                    <div class="row mb-3">
                        <div class="col-md-5">
                            <p:inputText value="#{medicoBean.filtroTexto}"
                                         placeholder="Buscar por nombre, apellido o DUI..."
                                         styleClass="form-control">
                                <p:ajax event="keyup" delay="400"
                                        listener="#{medicoBean.filtrar}"
                                        update="tablaMedicos"/>
                            </p:inputText>
                        </div>
                        <div class="col-md-4">
                            <p:selectOneMenu value="#{medicoBean.filtroEspecialidad}"
                                             styleClass="form-control">
                                <f:selectItem itemLabel="-- Todas las especialidades --" itemValue="#{null}"/>
                                <f:selectItems value="#{medicoBean.especialidades}"
                                               var="e"
                                               itemValue="#{e.idEspecialidad}"
                                               itemLabel="#{e.nombre}"/>
                                <p:ajax event="change"
                                        listener="#{medicoBean.filtrar}"
                                        update="tablaMedicos"/>
                            </p:selectOneMenu>
                        </div>
                        <div class="col-md-3">
                            <p:commandButton value="Limpiar"
                                             icon="fas fa-eraser"
                                             actionListener="#{medicoBean.limpiarFiltros}"
                                             update="formFiltro tablaMedicos"
                                             styleClass="btn btn-secondary"/>
                        </div>
                    </div>
                

                <!-- ===== Tabla ===== -->
                <p:dataTable id="tablaMedicos"
                             var="med"
                             value="#{medicoBean.medicosFiltrados}"
                             styleClass="table table-striped table-hover"
                             emptyMessage="No hay médicos registrados"
                             rows="10"
                             paginator="true"
                             paginatorPosition="bottom"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             rowsPerPageTemplate="5,10,25,50"
                             currentPageReportTemplate="Mostrando {startRecord} a {endRecord} de {totalRecords}">

                    <p:column headerText="ID" style="width:60px">
                        <h:outputText value="#{med.idMedico}"/>
                    </p:column>
                    <p:column headerText="Nombres">
                        <h:outputText value="#{med.nombres}"/>
                    </p:column>
                    <p:column headerText="Apellidos">
                        <h:outputText value="#{med.apellidos}"/>
                    </p:column>
                    <p:column headerText="DUI">
                        <h:outputText value="#{med.dui}"/>
                    </p:column>
                    <p:column headerText="Especialidad">
                        <span class="badge badge-info">
                            <h:outputText value="#{med.especialidad.nombre}"/>
                        </span>
                    </p:column>
                    <p:column headerText="Teléfono">
                        <h:outputText value="#{med.telefono}"/>
                    </p:column>
                    <p:column headerText="Correo">
                        <h:outputText value="#{med.correo}"/>
                    </p:column>
                    <p:column headerText="Acciones" styleClass="text-center" style="width:130px">
                        <p:commandButton icon="fas fa-edit"
                                         title="Editar"
                                         actionListener="#{medicoBean.editar(med)}"
                                         oncomplete="PF('dlgMedico').show()"
                                         update=":formMedico"
                                         styleClass="btn btn-warning btn-sm mr-1"/>
                        <p:commandButton icon="fas fa-trash"
                                         title="Eliminar"
                                         actionListener="#{medicoBean.eliminar(med)}"
                                         update="growl tablaMedicos formFiltro"
                                         styleClass="btn btn-danger btn-sm"
                                         onclick="return confirm('¿Eliminar este médico?');"/>
                    </p:column>
                </p:dataTable>
                </h:form>
            </div>
        </div>

        <!-- ===== Diálogo Crear/Editar ===== -->
        <p:dialog header="Datos del Médico"
                  widgetVar="dlgMedico"
                  modal="true"
                  responsive="true"
                  width="640"
                  appendTo="@(body)"
                  showEffect="fade"
                  hideEffect="fade">
            <h:form id="formMedico">
                <p:panelGrid columns="2" layout="grid" styleClass="w-100" columnClasses="col-4,col-8">
                    <p:outputLabel for="nombres" value="Nombres:"/>
                    <p:inputText id="nombres" value="#{medicoBean.medico.nombres}"
                                 required="true" styleClass="form-control"/>

                    <p:outputLabel for="apellidos" value="Apellidos:"/>
                    <p:inputText id="apellidos" value="#{medicoBean.medico.apellidos}"
                                 required="true" styleClass="form-control"/>

                    <p:outputLabel for="dui" value="DUI:"/>
                    <p:inputText id="dui" value="#{medicoBean.medico.dui}"
                                 required="true" styleClass="form-control"
                                 placeholder="00000000-0"/>

                    <p:outputLabel for="telefono" value="Teléfono:"/>
                    <p:inputText id="telefono" value="#{medicoBean.medico.telefono}"
                                 styleClass="form-control"/>

                    <p:outputLabel for="correo" value="Correo:"/>
                    <p:inputText id="correo" value="#{medicoBean.medico.correo}"
                                 styleClass="form-control"/>

                    <p:outputLabel for="esp" value="Especialidad:"/>
                    <p:selectOneMenu id="esp"
                                     value="#{medicoBean.idEspecialidadSeleccionada}"
                                     required="true" styleClass="form-control">
                        <f:selectItem itemLabel="-- Seleccione --" itemValue="#{null}"/>
                        <f:selectItems value="#{medicoBean.especialidades}"
                                       var="e"
                                       itemValue="#{e.idEspecialidad}"
                                       itemLabel="#{e.nombre}"/>
                    </p:selectOneMenu>
                </p:panelGrid>

                <div class="text-right mt-3">
                    <p:commandButton value="Guardar"
                                     icon="fas fa-save"
                                     actionListener="#{medicoBean.guardar}"
                                     update="growl tablaMedicos formFiltro @form"
                                     oncomplete="if (!args || !args.validationFailed) PF('dlgMedico').hide();"
                                     styleClass="btn btn-primary"/>
                    <p:commandButton value="Cancelar"
                                     icon="fas fa-times"
                                     type="button"
                                     onclick="PF('dlgMedico').hide()"
                                     styleClass="btn btn-secondary ml-2"/>
                </div>
            </h:form>
        </p:dialog>

    </ui:define>
</ui:composition>
</body>
</html>
