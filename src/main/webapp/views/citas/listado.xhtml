<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/WEB-INF/templates/layout.xhtml">
    
    <ui:define name="titulo">Gestión de Citas Médicas</ui:define>

    <ui:define name="tituloPagina">Gestión de Citas</ui:define>

    <ui:define name="contenido">
        <h:form id="formCitas">
            <p:growl id="messages" showDetail="true" />

            <div class="card">
                <p:toolbar>
                    <p:toolbarGroup>
                        <p:commandButton value="Nueva Cita" icon="pi pi-plus" 
                                         actionListener="#{citaBean.nueva}"
                                         update=":dialogs:manage-cita-content" 
                                         oncomplete="PF('manageCitaDialog').show()"
                                         styleClass="ui-button-success" style="margin-right: .5rem" />
                    </p:toolbarGroup>
                </p:toolbar>

                <p:dataTable id="dt-citas" widgetVar="dtCitas" var="c" value="#{citaBean.citasFiltradas}"
                             reflow="true" styleClass="citas-table" paginator="true" rows="10" 
                             paginatorPosition="bottom">
                    
                    <f:facet name="header">
                        <div class="citas-table-header">
                            <span style="font-weight: bold">LISTADO DE CITAS</span>
                        </div>
                    </f:facet>

                    <p:column headerText="ID" sortBy="#{c.idCita}">
                        <h:outputText value="#{c.idCita}" />
                    </p:column>

                    <p:column headerText="Paciente">
                        <h:outputText value="#{c.paciente.nombres} #{c.paciente.apellidos}" />
                    </p:column>

                    <p:column headerText="Médico">
                        <h:outputText value="#{c.medico.nombres} #{c.medico.apellidos}" />
                    </p:column>

                    <p:column headerText="Fecha" sortBy="#{c.fecha}">
                        <h:outputText value="#{c.fechaTexto}" />
                    </p:column>

                    <p:column headerText="Hora">
                        <h:outputText value="#{c.horaTexto}" />
                    </p:column>

                    <p:column headerText="Estado" sortBy="#{c.estado}">
                        <h:outputText value="#{c.estado}" />
                    </p:column>

                    <p:column headerText="Motivo">
                        <h:outputText value="#{c.motivo}" />
                    </p:column>

                    <p:column headerText="Acciones" exportable="false">
                        <p:commandButton icon="pi pi-pencil" update=":dialogs:manage-cita-content"
                                         oncomplete="PF('manageCitaDialog').show()"
                                         styleClass="edit-button rounded-button ui-button-success" process="@this"
                                         actionListener="#{citaBean.editar(c)}">
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
            </div>
        </h:form>

        <h:form id="dialogs">
            <p:dialog header="Detalles de Cita" showEffect="fade" modal="true" widgetVar="manageCitaDialog" responsive="true">
                <p:outputPanel id="manage-cita-content" class="ui-fluid">
                    <p:panelGrid columns="2" layout="grid" rendered="#{not empty citaBean.cita}">
                        
                        <p:outputLabel for="paciente" value="Paciente:" />
                        <p:selectOneMenu id="paciente" value="#{citaBean.idPacienteSeleccionado}" required="true">
                            <f:selectItem itemLabel="Seleccione un paciente" itemValue="" />
                            <f:selectItems value="#{citaBean.pacientes}" var="p" 
                                           itemLabel="#{p.nombres} #{p.apellidos}" itemValue="#{p.idPaciente}" />
                        </p:selectOneMenu>

                        <p:outputLabel for="medico" value="Médico:" />
                        <p:selectOneMenu id="medico" value="#{citaBean.idMedicoSeleccionado}" required="true">
                            <f:selectItem itemLabel="Seleccione un médico" itemValue="" />
                            <f:selectItems value="#{citaBean.medicos}" var="m" 
                                           itemLabel="#{m.nombres} #{m.apellidos}" itemValue="#{m.idMedico}" />
                        </p:selectOneMenu>

                        <p:outputLabel for="estado" value="Estado:" />
                        <p:selectOneMenu id="estado" value="#{citaBean.cita.estado}">
                            <f:selectItems value="#{citaBean.estadosCita}" />
                        </p:selectOneMenu>

                        <p:outputLabel for="motivo" value="Motivo:" />
                        <p:inputTextarea id="motivo" value="#{citaBean.cita.motivo}" rows="3" />
                    </p:panelGrid>
                </p:outputPanel>

                <f:facet name="footer">
                    <p:commandButton value="Guardar" icon="pi pi-check" actionListener="#{citaBean.guardar}"
                                     update="manage-cita-content :formCitas:dt-citas :formCitas:messages" 
                                     process="manage-cita-content @this" />
                    <p:commandButton value="Cancelar" icon="pi pi-times" onclick="PF('manageCitaDialog').hide()"
                                     class="ui-button-secondary" type="button" />
                </f:facet>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
</html>
