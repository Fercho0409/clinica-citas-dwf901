<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
<h:head/>
<body>
<ui:composition template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="titulo">Citas</ui:define>
    <ui:define name="tituloPagina">Gestión de Citas Médicas</ui:define>

    <ui:define name="contenido">

        <p:growl id="growlCita" showDetail="true" life="4000"/>

        <div class="card card-warning card-outline">
            <div class="card-header">
                <h3 class="card-title"><i class="fas fa-calendar-check mr-2"/>Listado de Citas</h3>
                <div class="card-tools">
                    <h:form>
                        <p:commandButton value="Nueva Cita"
                                         icon="fas fa-plus"
                                         actionListener="#{citaBean.nueva}"
                                         oncomplete="PF('dlgCita').show()"
                                         update=":formCita"
                                         styleClass="btn btn-warning btn-sm"/>
                    </h:form>
                </div>
            </div>

            <div class="card-body">

                <!-- ===== Filtros AJAX ===== -->
                <h:form id="formFiltroCita">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <p:inputText value="#{citaBean.filtroTexto}"
                                         placeholder="Buscar por nombre o DUI del paciente..."
                                         styleClass="form-control">
                                <p:ajax event="keyup" delay="400"
                                        listener="#{citaBean.filtrar}"
                                        update="tablaCitas"/>
                            </p:inputText>
                        </div>
                        <div class="col-md-3">
                            <p:commandButton value="Limpiar"
                                             icon="fas fa-eraser"
                                             actionListener="#{citaBean.limpiarFiltros}"
                                             update="formFiltroCita tablaCitas"
                                             styleClass="btn btn-secondary"/>
                        </div>
                    </div>

                    <!-- ===== Tabla Citas ===== -->
                    <p:dataTable id="tablaCitas"
                                 var="c"
                                 value="#{citaBean.citasFiltradas}"
                                 styleClass="table table-striped table-hover"
                                 emptyMessage="No hay citas registradas"
                                 rows="10"
                                 paginator="true"
                                 paginatorPosition="bottom"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rowsPerPageTemplate="5,10,25,50"
                                 currentPageReportTemplate="Mostrando {startRecord} a {endRecord} de {totalRecords}">

                        <p:column headerText="ID" style="width:60px">
                            <h:outputText value="#{c.idCita}"/>
                        </p:column>
                        <p:column headerText="Paciente">
                            <h:outputText value="#{c.paciente.nombres} #{c.paciente.apellidos}"/>
                        </p:column>
                        <p:column headerText="Médico">
                            <h:outputText value="#{c.medico.nombres} #{c.medico.apellidos}"/>
                        </p:column>
                        <p:column headerText="Fecha">
                            <h:outputText value="#{c.fechaTexto}"/>
                        </p:column>
                        <p:column headerText="Hora">
                            <h:outputText value="#{c.horaTexto}"/>
                        </p:column>
                        <p:column headerText="Estado">
                            <span class="badge #{citaBean.badgeEstado(c.estado)}">#{c.estado.etiqueta}</span>
                        </p:column>
                        <p:column headerText="Motivo">
                            <h:outputText value="#{c.motivo}"/>
                        </p:column>
                        <p:column headerText="Acciones" styleClass="text-center" style="width:190px">
                            <p:commandButton icon="fas fa-edit"
                                             title="Editar"
                                             actionListener="#{citaBean.editar(c)}"
                                             oncomplete="PF('dlgCita').show()"
                                             update=":formCita"
                                             styleClass="btn btn-warning btn-sm mr-1"/>
                            <p:commandButton icon="fas fa-check"
                                             title="Marcar como atendida"
                                             rendered="#{c.modificable}"
                                             actionListener="#{citaBean.marcarAtendida(c)}"
                                             update=":growlCita tablaCitas"
                                             styleClass="btn btn-success btn-sm mr-1"/>
                            <p:commandButton icon="fas fa-ban"
                                             title="Cancelar cita"
                                             rendered="#{c.modificable}"
                                             actionListener="#{citaBean.cancelar(c)}"
                                             update=":growlCita tablaCitas"
                                             styleClass="btn btn-secondary btn-sm mr-1"
                                             onclick="return confirm('¿Cancelar esta cita? El horario quedará libre.');"/>
                            <p:commandButton icon="fas fa-trash"
                                             title="Eliminar"
                                             actionListener="#{citaBean.eliminar(c)}"
                                             update=":growlCita tablaCitas"
                                             styleClass="btn btn-danger btn-sm"
                                             onclick="return confirm('¿Eliminar esta cita?');"/>
                        </p:column>
                    </p:dataTable>
                </h:form>
            </div>
        </div>

        <!-- ===== Diálogo Crear/Editar Cita ===== -->
        <p:dialog header="Datos de la Cita"
                  widgetVar="dlgCita"
                  modal="true"
                  responsive="true"
                  width="600"
                  appendTo="@(body)"
                  showEffect="fade"
                  hideEffect="fade"
                  styleClass="bg-white">
            <h:form id="formCita">
                <p:panelGrid columns="2" layout="grid" styleClass="w-100" columnClasses="col-4,col-8">
                    <p:outputLabel for="cpaciente" value="Paciente:"/>
                    <p:selectOneMenu id="cpaciente" value="#{citaBean.idPacienteSeleccionado}"
                                     required="true" styleClass="form-control">
                        <f:selectItem itemLabel="-- Seleccionar Paciente --" itemValue=""/>
                        <f:selectItems value="#{citaBean.pacientes}" var="p"
                                       itemLabel="#{p.nombres} #{p.apellidos}" itemValue="#{p.idPaciente}"/>
                    </p:selectOneMenu>

                    <p:outputLabel for="cmedico" value="Médico:"/>
                    <p:selectOneMenu id="cmedico" value="#{citaBean.idMedicoSeleccionado}"
                                     required="true" styleClass="form-control">
                        <f:selectItem itemLabel="-- Seleccionar Médico --" itemValue=""/>
                        <f:selectItems value="#{citaBean.medicos}" var="m"
                                       itemLabel="#{m.nombres} #{m.apellidos} (#{m.especialidad.nombre})" itemValue="#{m.idMedico}"/>
                    </p:selectOneMenu>

                    <p:outputLabel for="cfecha" value="Fecha Cita:"/>
                    <p:datePicker id="cfecha" value="#{citaBean.cita.fecha}"
                                  pattern="dd/MM/yyyy" showButtonBar="true"
                                  required="true" styleClass="form-control"/>

                    <p:outputLabel for="chora" value="Hora:"/>
                    <p:inputText id="chora" value="#{citaBean.horaStr}"
                                 required="true" styleClass="form-control" placeholder="10:00"/>

                    <p:outputLabel for="cestado" value="Estado:"/>
                    <p:selectOneMenu id="cestado" value="#{citaBean.cita.estado}" styleClass="form-control">
                        <f:selectItem itemLabel="PROGRAMADA" itemValue="PROGRAMADA"/>
                        <f:selectItem itemLabel="ATENDIDA" itemValue="ATENDIDA"/>
                        <f:selectItem itemLabel="CANCELADA" itemValue="CANCELADA"/>
                        <f:selectItem itemLabel="REPROGRAMADA" itemValue="REPROGRAMADA"/>
                    </p:selectOneMenu>

                    <p:outputLabel for="cmotivo" value="Motivo:"/>
                    <p:inputTextarea id="cmotivo" value="#{citaBean.cita.motivo}"
                                     rows="2" styleClass="form-control"/>
                </p:panelGrid>

                <div class="text-right mt-3">
                    <p:commandButton value="Guardar"
                                     icon="fas fa-save"
                                     actionListener="#{citaBean.guardar}"
                                     update=":growlCita :formFiltroCita:tablaCitas :formFiltroCita @form"
                                     oncomplete="if (!args.validationFailed) PF('dlgCita').hide();"
                                     styleClass="btn btn-warning"/>
                    <p:commandButton value="Cancelar"
                                     icon="fas fa-times"
                                     type="button"
                                     onclick="PF('dlgCita').hide()"
                                     styleClass="btn btn-secondary ml-2"/>
                </div>
            </h:form>
        </p:dialog>

    </ui:define>
</ui:composition>
</body>
</html>
