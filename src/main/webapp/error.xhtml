<!DOCTYPE html>
<!--
    Pagina de error comun de las pantallas (Fase 4, tarea 3).

    No usa la plantilla layout.xhtml a proposito: si el error viene de la
    plantilla o de la sesion, la pagina de error no debe volver a fallar
    por lo mismo. Solo depende de PaginaErrorBean.
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<f:view contentType="text/html" encoding="UTF-8">
<h:head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>#{paginaErrorBean.titulo} - Clínica UDB</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
</h:head>
<h:body styleClass="hold-transition login-page">
    <div class="card card-outline card-danger" style="max-width: 520px; width: 100%;">
        <div class="card-header text-center">
            <span class="h4"><b>Clínica</b> UDB</span>
        </div>
        <div class="card-body text-center">
            <h:panelGroup rendered="#{paginaErrorBean.codigo gt 0}">
                <h1 class="display-4 text-danger mb-0">#{paginaErrorBean.codigo}</h1>
            </h:panelGroup>
            <h:panelGroup rendered="#{paginaErrorBean.sesionCaducada}">
                <i class="fas fa-clock fa-3x text-warning mb-3"/>
            </h:panelGroup>

            <h3 class="mt-2">#{paginaErrorBean.titulo}</h3>
            <p class="text-muted">#{paginaErrorBean.descripcion}</p>

            <h:panelGroup rendered="#{not empty paginaErrorBean.referencia}">
                <p class="mb-3">
                    Código de referencia:
                    <span class="badge badge-secondary" style="font-size: 1rem;">#{paginaErrorBean.referencia}</span>
                </p>
            </h:panelGroup>

            <a href="#{request.contextPath}/index.xhtml" class="btn btn-primary">
                <i class="fas fa-home mr-1"/> Ir al inicio
            </a>
            <a href="#{request.contextPath}/login.xhtml" class="btn btn-outline-secondary ml-2">
                <i class="fas fa-sign-in-alt mr-1"/> Iniciar sesión
            </a>
        </div>
    </div>
</h:body>
</f:view>
</html>
